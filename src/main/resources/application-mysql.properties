spring.datasource.url=${DATAGUARD_DB_URL:jdbc:mysql://127.0.0.1:3306/dataguard?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATAGUARD_DB_USERNAME}
spring.datasource.password=${DATAGUARD_DB_PASSWORD}
spring.sql.init.schema-locations=classpath:schema-mysql.sql
# Connector/J rewrites each existing 250-row JDBC batch into a bounded multi-row INSERT.
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
