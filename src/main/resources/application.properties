spring.application.name=DataGuard
server.address=${DATAGUARD_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:${DATAGUARD_DB_PATH:./var/db/dataguard};MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DATAGUARD_LOCAL_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=6MB
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
dataguard.storage-root=${DATAGUARD_STORAGE_ROOT:./var/uploads}
dataguard.import-root=${DATAGUARD_IMPORT_ROOT:./data/raw}
